traces:
  otlp:
    grpc:
      enabled: true
      receiverConfig: {}

ingester:
  affinity: null
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  persistence:
    enabled: true
    size: 50Gi
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 50m
      memory: 700Mi
    limits:
      cpu: 50m
      memory: 700Mi

