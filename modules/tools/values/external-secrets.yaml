global:
  nodeSelector:
    kubernetes.io/arch: amd64
    karpenter.sh/capacity-type: "${capacity_type}"
  tolerations:
    - key: "${capacity_type}"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "arch/amd"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

installCRDs: true
resources:
  requests:
    cpu: "${resources.cpu}"
    memory: "${resources.memory}"
  limits:
    cpu: "${resources.cpu}"
    memory: "${resources.memory}"
webhook:
  port: 9443
  resources:
    requests:
      cpu: "${resources.cpu}"
      memory: "${resources.memory}"
    limits:
      cpu: "${resources.cpu}"
      memory: "${resources.memory}"
certController:
  resources:
    requests:
      cpu: "${resources.cpu}"
      memory: "${resources.memory}"
    limits:
      cpu: "${resources.cpu}"
      memory: "${resources.memory}"
