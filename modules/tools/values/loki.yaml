gateway:
  affinity: null
  resources:
    limits:
      cpu: 50m
      memory: 72Mi
    requests:
      cpu: 50m
      memory: 72Mi
  basicAuth:
    enabled: false
    username: admin
    password: ${loki_password}
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"

lokiCanary:
  resources:
    limits:
      cpu: 10m
      memory: 22Mi
    requests:
      cpu: 10m
      memory: 22Mi
  tolerations:
    - key: "type"
      value: "karpenter"
      operator: "Equal"
      effect: "NoSchedule"
    - key: "on-demand"
      value: "true"
      operator: "Equal"
      effect: "NoSchedule"
    - key: "spot"
      value: "true"
      operator: "Equal"
      effect: "NoSchedule"
    - key: "type"
      operator: "Equal"
      value: "karpenter"
      effect: "NoSchedule"
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "arch/amd"
      operator: "Equal"
      value: "true"

bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0