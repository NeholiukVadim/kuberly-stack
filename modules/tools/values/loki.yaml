loki:
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: ${loki_s3_bucket_region}
      bucketnames: ${loki_s3_bucket_name}
      s3forcepathstyle: false
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    max_query_lookback: 168h
    retention_period: 168h
  querier:
    max_concurrent: 4

  storage:
    type: s3
    bucketNames:
      chunks: ${loki_s3_bucket_name}
      ruler: ${loki_s3_bucket_name}
      admin: ${loki_s3_bucket_name}
    s3:
      region: ${loki_s3_bucket_region}

deploymentMode: Distributed

serviceAccount:
  annotations:
    "eks.amazonaws.com/role-arn": "${loki_s3_role_arn}"

minio:
  enabled: false

ingester:
  affinity: null
  replicas: 2
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 200m
      memory: 500Mi
  zoneAwareReplication:
    enabled: false
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"

querier:
  affinity: null
  replicas: 2
  maxUnavailable: 1
  resources:
    limits:
      cpu: 500m
      memory: 600Mi
    requests:
      cpu: 500m
      memory: 600Mi
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"

queryFrontend:
  affinity: null
  replicas: 2
  maxUnavailable: 1
  resources:
    limits:
      cpu: 100m
      memory: 300Mi
    requests:
      cpu: 100m
      memory: 300Mi
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"

queryScheduler:
  affinity: null
  replicas: 2
  resources:
    limits:
      cpu: 60m
      memory: 72Mi
    requests:
      cpu: 60m
      memory: 72Mi
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"

distributor:
  affinity: null
  replicas: 2
  maxUnavailable: 1
  resources:
    limits:
      cpu: 30m
      memory: 126Mi
    requests:
      cpu: 30m
      memory: 126Mi
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"

compactor:
  affinity: null
  replicas: 1
  resources:
    limits:
      cpu: 10m
      memory: 156Mi
    requests:
      cpu: 10m
      memory: 156Mi
  tolerations:
    - key: "arch/arm"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "on-demand"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    topology.kubernetes.io/zone: "${aws_zone}"
  working_directory: /data/retention
  delete_request_store: s3
  retention_enabled: true

indexGateway:
  affinity: null
  replicas: 2
  maxUnavailable: 1
  resources:
