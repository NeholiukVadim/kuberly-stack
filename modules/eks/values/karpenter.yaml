replicas: 1

settings:
  clusterName: ${cluster_name}
  clusterEndpoint: ${cluster_endpoint}
  interruptionQueueName: ${queue_name}

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: ${iam_role_arn}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"

tolerations:
- key: "type"
  value: "karpenter"
  operator: "Equal"
  effect: "NoSchedule"

dnsPolicy: Default

controller:
  env:
    - name: AWS_ENI_LIMITED_POD_DENSITY
      value: "false"
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 1
      memory: 1Gi

postInstallHook:
  image:
    repository: ${image_registry}/tech-images
    tag: "kubectl-1-33-3"
    digest: ""